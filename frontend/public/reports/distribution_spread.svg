<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 20px; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 16px; fill: #334155; text-anchor: middle; }
    .axis-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #475569; }
    .grid-line { stroke: #e2e8f0; stroke-width: 1; }
    .quartile-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 3,3; }
    .evaluator-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #1e293b; text-anchor: middle; }
  </style>

  <!-- Titles -->
  <text x="350" y="32" class="title">Distribution Spread:</text>
  <text x="350" y="55" class="subtitle">How Grades Vary Between Evaluators</text>

  <!-- Y Axis Grid and Labels -->
  <g>
    <!-- Y Axis Title -->
    <text x="25" y="240" class="axis-label" transform="rotate(-90 25 240)" text-anchor="middle">Marks Awarded</text>

    <!-- Grid lines & numbers: 6, 5, 4, 3, 2, 1, 0, -1 -->
    <text x="60" y="94" class="axis-label">6</text>
    <line x1="80" y1="90" x2="650" y2="90" class="grid-line" />

    <text x="60" y="144" class="axis-label">5</text>
    <line x1="80" y1="140" x2="650" y2="140" class="grid-line" />

    <text x="60" y="194" class="axis-label">4</text>
    <line x1="80" y1="190" x2="650" y2="190" class="grid-line" />

    <text x="60" y="244" class="axis-label">3</text>
    <line x1="80" y1="240" x2="650" y2="240" class="grid-line" />

    <text x="60" y="294" class="axis-label">2</text>
    <line x1="80" y1="290" x2="650" y2="290" class="grid-line" />

    <text x="60" y="344" class="axis-label">1</text>
    <line x1="80" y1="340" x2="650" y2="340" class="grid-line" />

    <text x="60" y="394" class="axis-label">0</text>
    <line x1="80" y1="390" x2="650" y2="390" class="grid-line" />

    <text x="55" y="444" class="axis-label">-1</text>
    <line x1="80" y1="440" x2="650" y2="440" class="grid-line" />
  </g>

  <!-- Violin 1: Teacher Marks (Center x = 230) -->
  <g transform="translate(230, 0)">
    <!-- Violin Shape -->
    <path d="M 0 90 C 25 110 90 140 90 190 C 90 230 40 250 40 270 C 40 280 110 300 110 340 C 110 370 40 390 0 440 C -40 390 -110 370 -110 340 C -110 300 -40 280 -40 270 C -40 250 -90 230 -90 190 C -90 140 -25 110 0 90 Z" fill="#f59e0b" fill-opacity="0.55" stroke="#b45309" stroke-width="1.5" />
    
    <!-- Quartile Dashed Lines inside Violin 1 -->
    <line x1="-88" y1="190" x2="88" y2="190" class="quartile-line" />
    <line x1="-40" y1="240" x2="40" y2="240" class="quartile-line" />
    <line x1="-109" y1="340" x2="109" y2="340" class="quartile-line" />
  </g>
  <text x="230" y="472" class="evaluator-label">Teacher Marks</text>

  <!-- Violin 2: AISS Marks (Center x = 500) -->
  <g transform="translate(500, 0)">
    <!-- Violin Shape -->
    <path d="M 0 90 C 25 110 105 140 105 190 C 105 230 45 250 45 270 C 45 280 100 300 100 340 C 100 370 35 390 0 440 C -35 390 -100 370 -100 340 C -100 300 -45 280 -45 270 C -45 250 -105 230 -105 190 C -105 140 -25 110 0 90 Z" fill="#0284c7" fill-opacity="0.75" stroke="#0369a1" stroke-width="1.5" />
    
    <!-- Quartile Dashed Lines inside Violin 2 -->
    <line x1="-104" y1="190" x2="104" y2="190" class="quartile-line" />
    <line x1="-45" y1="215" x2="45" y2="215" class="quartile-line" />
    <line x1="-99" y1="340" x2="99" y2="340" class="quartile-line" />
  </g>
  <text x="500" y="472" class="evaluator-label">AISS Marks</text>
</svg>
